<style>
    
    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center; 
        min-height: 100vh;
        background-color: #f0f0f0; 
        background-image: url("IMG_20260125_012425.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
         backdrop-filter: blur(10px);
    }

    
    .border {
        width: 100%;
        max-width: 500px; 
        
        min-height: 100vh;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.74);
        display: flex;
        flex-direction: column;
        align-items: center; 
        border-radius: 40px;
        backdrop-filter: blur(10px);
        

    }

    
    .header-img {
        width: 250px;
        height: 250px; 
        border-radius:20px;
        object-fit: cover;
        box-shadow: 0px 0px 20px rgba(0, 35, 99, 0.747);
         
    }

    
    .moon {
        position: relative;
        margin-top: -50px; 
        width: 100px;
        height: 100px;
        background: linear-gradient(0deg, rgb(184, 203, 255) -25%, rgb(49, 87, 143));
        border-radius: 50%;
        border: 3px solid rgb(196, 238, 255);
        box-shadow: 0px 0px 30px rgb(141, 223, 255);
        z-index: 10;
        left: -190px;
        animation: aa 3s ease-in-out infinite;
    }
    @keyframes aa {
        0%{ transform: translateY(0px); 
        }
            50% {transform: translateY(-20px);
            }
        100% {transform: translateY(0px);
        }
       
        
        
    }
    @keyframes bb {
        0%{ transform: rotate(0deg); 
        }
            25% {transform: rotate(3deg);
            }
        50% {transform: rotate(-3deg);
        }
        75% {transform: rotate(3deg);
        }
        100% {transform: rotate(0deg);
        }
    }
    @keyframes cc {
        to {
            transform: translateX(calc(-5 * (12rem + 5rem)))
        };
        
    }

    .moon2 {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 60%;
        transform: translate(-50%, -50%); 
        overflow: hidden;
        border: 2px solid white;
    }

    .moon2 img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    
    .menu {
        width: 100%;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px; 
        box-sizing: border-box;
        justify-content: center; 
         align-items: center; 
          
    }

    .menu button {
        width: 300px;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #dddddd;
        background: rgba(255, 255, 255, 0.363);
        cursor: pointer;
        transition: 0.3s;
        font-size: 16px;
        backdrop-filter: blur(10px);
       
        
        
        
    }

    .menu button:hover {
        background-color: #f8f8f8;
        transform: scale(1.02);
    }

    .menu a {
        text-decoration: none;

        
    }
    .y-button {
        
  display: flex;        
  justify-content: center; 
  align-items: center;    
  width: 100%;           
  max-width: 300px;       
  padding: 12px 20px;    
  gap: 10px;             
box-shadow:  0px 4px 6px rgba(0, 0, 0, 0.438), 
            0px 1px 3px rgba(0, 0, 0, 0.377);
  background-color: white; 
  border: 1px solid #ddd; 
  cursor: pointer;         
  transition: all 0.3s ease; 
  font-size: 16px;
  color: #ffffff;
  text-shadow: 0px 0px 5px rgb(0, 0, 0);
   backdrop-filter: blur(10px);
  
}

.social-btn:hover {
  background-color: #f8f8f8;
  transform: translateY(-2px); 
}

.y-icon {
    object-fit: cover;
    left: 0pxss;
    border-radius: 25%;
  width: 104px;   
  height: 104px;  
  object-fit: contain; 
   box-shadow:0px 4px 6px rgb(0, 0, 0);
            animation: bb 3s ease-in-out infinite;
}
 .hanyuu{
    display:inline-block;

    position: absolute;
    color: rgb(255, 255, 255);
    text-shadow: 0px 0px 5px rgb(127, 225, 255);
    margin-top: 40px;
    left: 120px;
    top:240px;
   
 }   
 .wraper{
    
    background: rgba(255, 255, 255, 0);
    width: max-content;
        height: 250px;
        
    justify-content: center;
    border-radius: 40px;
    box-shadow:0px 0px 50px rgb(103, 164, 255), 
            0px 1px 30px rgba(0, 0, 0, 0.377);
    overflow: hidden;
    grid-auto-flow: column;
     display: grid;
     gap: 10px;
      padding: 10px;
      
      backdrop-filter: blur(10px);
      
      grid-auto-columns:  16rem ;
      gap: 3rem;
      animation: cc 30s linear infinite;
      
 }
    .background-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 275px;
        object-fit: cover;
        z-index: -1; 
         filter: blur(5px);
         opacity: 0.7;
    }
</style>
